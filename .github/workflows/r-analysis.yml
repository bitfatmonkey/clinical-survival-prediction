name: R survival analysis
on:
  pull_request:
  push:
    branches: [main, feature/r-clinical-survival-portfolio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
      RENV_CONFIG_INSTALL_NCPUS: 2
      OMP_NUM_THREADS: 2
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake pkg-config libcurl4-openssl-dev libssl-dev libxml2-dev libicu-dev libglpk-dev libuv1-dev libx11-dev libcairo2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff-dev libjpeg-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Execute analysis, render report, run tests
        run: Rscript scripts/run_all.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-analysis-evidence
          path: |
            reports/
            figures/
